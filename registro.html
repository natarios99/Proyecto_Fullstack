<div class="container mt-5">
  <div class="row justify-content-center">
    
    <form id="form-registro" class="col-12 col-md-6 col-lg-4 p-4 border rounded shadow-sm bg-white">
        <h5>Ingrese sus datos para registrarse</h5>

      <div class="mb-3">
        <label for="nombre" class="form-label small text-muted mb-1">Nombre</label>
        <input type="text" class="form-control form-control-sm" id="nombre" required>
      </div>

      <div class="mb-3">
        <label for="apellidos" class="form-label small text-muted mb-1">Apellido</label>
        <input type="text" class="form-control form-control-sm" id="apellidos" required>
      </div>

      <div class="mb-3">
        <label for="email-registro" class="form-label small text-muted mb-1">Correo electronico</label>
        <input type="email" class="form-control" id="email-registro" required>
      </div>

      <div class="mb-3">
        <label for="password-registro" class="form-label small text-muted mb-1">Contraseña</label>
        <input type="password" class="form-control form-control-sm" id="password-registro" required>
      </div>

      <div class="mb-3">
        <label for="confirm-password-registro" class="form-label small text-muted mb-1">Confirmar Contraseña</label>
        <input type="password" class="form-control form-control-sm" id="confirm-password-registro" required>
      </div>

      <div class="mb-3">
        <label for="numeroTelefono" class="form-label small text-muted mb-1">Número de telefono</label>
        <input type="number" class="form-control form-control-sm" id="numeroTelefono">
      </div>

      <button type="submit" class="btn btn-primary btn-sm w-100 mt-2">Registrarme</button>
    </form>
  </div>
</div>
